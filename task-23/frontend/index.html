<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Management System</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
    form, .bar { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
    input { padding: .4rem; flex: 1 1 140px; }
    button { padding: .4rem .8rem; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #ddd; padding: .4rem; text-align: left; }
    #msg { color: #b00020; min-height: 1.2rem; }
  </style>
</head>
<body>
  <h1>Student Management System</h1>
  <p id="msg"></p>

  <form id="form">
    <input id="name" placeholder="Name" required>
    <input id="email" type="email" placeholder="Email" required>
    <input id="course" placeholder="Course" required>
    <input id="age" type="number" min="1" placeholder="Age" required>
    <button type="submit" id="submit">Add student</button>
    <button type="button" id="cancel" hidden>Cancel</button>
  </form>

  <div class="bar">
    <input id="search" placeholder="Search by name, email or course">
  </div>

  <table>
    <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Age</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

<script>
  const API = "/api/students";
  const $ = id => document.getElementById(id);
  let editingId = null;

  async function request(url, options) {
    const res = await fetch(url, options);
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(typeof body.detail === "string" ? body.detail : "Request failed");
    }
    return res.status === 204 ? null : res.json();
  }

  async function load() {
    try {
      const q = $("search").value.trim();
      const students = await request(q ? `${API}?search=${encodeURIComponent(q)}` : API);
      const rows = $("rows");
      rows.replaceChildren();
      for (const s of students) {
        const tr = rows.insertRow();
        for (const v of [s.id, s.name, s.email, s.course, s.age]) tr.insertCell().textContent = v;
        const actions = tr.insertCell();
        const edit = document.createElement("button");
        edit.textContent = "Edit";
        edit.onclick = () => startEdit(s);
        const del = document.createElement("button");
        del.textContent = "Delete";
        del.onclick = () => remove(s.id);
        actions.append(edit, " ", del);
      }
      $("msg").textContent = "";
    } catch (e) { $("msg").textContent = e.message; }
  }

  function startEdit(s) {
    editingId = s.id;
    $("name").value = s.name; $("email").value = s.email;
    $("course").value = s.course; $("age").value = s.age;
    $("submit").textContent = "Update student";
    $("cancel").hidden = false;
  }

  function reset() {
    editingId = null;
    $("form").reset();
    $("submit").textContent = "Add student";
    $("cancel").hidden = true;
  }

  async function remove(id) {
    try { await request(`${API}/${id}`, { method: "DELETE" }); load(); }
    catch (e) { $("msg").textContent = e.message; }
  }

  $("form").onsubmit = async ev => {
    ev.preventDefault();
    const payload = {
      name: $("name").value, email: $("email").value,
      course: $("course").value, age: Number($("age").value),
    };
    try {
      await request(editingId ? `${API}/${editingId}` : API, {
        method: editingId ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      reset(); load();
    } catch (e) { $("msg").textContent = e.message; }
  };
  $("cancel").onclick = reset;
  $("search").oninput = load;
  load();
</script>
</body>
</html>
